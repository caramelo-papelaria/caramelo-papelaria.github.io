<!DOCTYPE html>
<html lang="{{ config.meta.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ config.meta.description }}">
    <title>{{ config.meta.title }}</title>
    <meta name="author" content="{{ config.meta.author }}">
    <link rel="canonical" href="{{ config.meta.siteUrl }}">
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
    <meta property="og:title" content="{{ config.meta.title }}">
    <meta property="og:description" content="{{ config.meta.description }}">
    <meta property="og:locale" content="{{ config.meta.lang }}">
    <meta name="twitter:title" content="{{ config.meta.title }}">
    <meta name="twitter:description" content="{{ config.meta.description }}">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <!-- Bandeirinhas de festa no topo -->
    <div class="bunting" aria-hidden="true"></div>

    <div class="card">
        <div class="badge">⚽ Copa do Mundo 2026 🏆</div>

        <header>
            <div class="avatar-wrapper">
                <img src="assets/img/picture.jpg" alt="{{ config.name }}" class="avatar">
                <div class="cup-ring"></div>
            </div>
            <h1>{{ config.name }}</h1>
            <p class="bio">{{ config.bio }}</p>
            <div class="flags" aria-hidden="true">
                <span class="flag" title="Brasil"><svg viewBox="0 0 24 16"><rect width="24" height="16" fill="#009c3b"/><polygon points="12,2 22,8 12,14 2,8" fill="#ffdf00"/><circle cx="12" cy="8" r="3.1" fill="#002776"/></svg></span>
            </div>
        </header>

        <main>
            <nav class="links">
                {% for link in config.links %}
                <a class="link-item" href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
                    <span class="link-deco">⚽</span>
                    <span class="link-label">{{ link.name }}</span>
                    <span class="link-arrow">›</span>
                </a>
                {% endfor %}
            </nav>
        </main>

        <footer>
            <p class="message">Que comece o jogo! Bora torcer juntos ⚽</p>
            <small>&copy; <span class="year"></span> {{ config.meta.author }}</small>
        </footer>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
